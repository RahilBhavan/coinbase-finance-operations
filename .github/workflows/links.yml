name: Check links

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept '200..=299,403,429' --max-retries 3 --retry-wait-time 5 --exclude 'operations-memo\.pdf$' './**/*.md' artifacts/generated/operator-report.html
          fail: false
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken links found by weekly check" --body-file ./lychee/out.md
